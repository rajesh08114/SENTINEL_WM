server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/mime.types;

    # Next.js static export with trailingSlash: files live at /route/index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(js|css|woff2?|svg)$ { add_header Cache-Control "public, max-age=86400"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
