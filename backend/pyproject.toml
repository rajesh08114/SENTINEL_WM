[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-wm-backend"
version = "0.1.0"
description = "FastAPI inference service for SENTINEL-WM (flow CSV / PCAP / telemetry -> attack-progression forecast + explanation + ATT&CK phase)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# NOTE: the `sentinel_wm` package (../research) must be installed first:
#   pip install -e ../research
#   pip install -e ./backend        (or: pip install -r requirements.txt)
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=1.5",
    "numpy>=1.23,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
