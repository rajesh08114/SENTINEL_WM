# SENTINEL-WM application stack.
#   1. build the model bundle first:  cd research && python -m sentinel_wm.research all && sentinel-wm bundle ../models
#   2. docker compose up --build
name: sentinel-wm

services:
  backend:
    build: ./backend          # self-contained; no research tree in the image
    image: sentinel-wm-backend
    ports:
      - "8000:8000"
    environment:
      SENTINEL_WM_MODEL_DIR: /models
      SENTINEL_DEVICE: cpu
      SENTINEL_WORKERS: "2"
      SENTINEL_MAX_SYNC_FLOWS: "20000"
      SENTINEL_CORS_ORIGINS: "*"
    volumes:
      - ./models:/models:ro          # the bundle - rebuild with `sentinel-wm bundle`, no image rebuild
      - backend_jobs:/app/data/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # frontend:                        # Phase 4 - uncomment once frontend/ is built
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   depends_on: [backend]

volumes:
  backend_jobs:
